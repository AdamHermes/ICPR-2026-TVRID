defaults:
  - data: data
  - _self_

seed: 42
track: rgb  # rgb | depth | cross

model:
  embedding_size: 512  # Start with 256, increase to 512 if training is stable
  lr: 3e-4
  margin: 0.3
  rgb_layers_not_frozen: 4  # Start with 4, can increase to 6 later

trainer:
  max_epochs: 50
  accelerator: auto
  devices: 1
  log_every_n_steps: 10
  enable_checkpointing: true
  precision: 16-mixed
  gradient_clip_val: 1.0

# Only ONE data section - this overrides defaults from data/data.yaml
data:
  root: data/DB_extracted
  train_csv: data/DB_extracted/train_split.csv
  eval_csv: data/DB_extracted/valid_split.csv
  train_subdir: train
  eval_subdir: train
  modality: rgb
  val_mode: train
  batch_size: 32
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
  mask_rgb_with_depth: false
  depth_mask_threshold: 0.2
  sequence:
    length: 5
    sampling: random
  transforms:
    resize: 256
    crop: 224
    rgb_mean: [0.485, 0.456, 0.406]
    rgb_std: [0.229, 0.224, 0.225]
    depth_mean: 0.0
    depth_std: 0.25