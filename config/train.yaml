defaults:
  - data: data
  - _self_

seed: 42
track: rgb

model:
  embedding_size: 256
  lr: 0.00035  # Exact LR from paper
  margin: 0.3
  rgb_layers_not_frozen: 4
  num_classes: 62  # Update based on your train split
  use_mctl: true
  use_center_loss: true

trainer:
  max_epochs: 120  # Paper uses 120 epochs
  accelerator: auto
  devices: 1
  log_every_n_steps: 10
  precision: 16-mixed
  gradient_clip_val: 1.0

data:
  root: data/DB_extracted
  train_csv: data/DB_extracted/train_split.csv
  eval_csv: data/DB_extracted/valid_split.csv
  train_subdir: train
  eval_subdir: train
  modality: rgb
  val_mode: train
  batch_size: 32  # Paper uses C×N structure (e.g., 8 classes × 4 instances = 32)
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
  sequence:
    length: 1  # Paper doesn't use sequences, just single frames
    sampling: random
  transforms:
    resize: 256
    crop: 224
    rgb_mean: [0.485, 0.456, 0.406]
    rgb_std: [0.229, 0.224, 0.225]
    depth_mean: 0.0
    depth_std: 0.25